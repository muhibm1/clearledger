name: clearledger
version: "0.1.0"
config-version: 2
profile: clearledger
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
vars:
  # Receivables are aged as of this date. The simulation ends here, so the
  # numbers stay the same whenever the project is rebuilt. Balances are the ones Odoo holds at
  # load time, not rebuilt as of this date: a payment dated after it still shows as settled
  # (the payment_after_as_of check warns). Override with `dbt build --vars '{as_of: ...}'`.
  as_of: "2026-10-27"
  company_currency: "USD"
models:
  clearledger:
    staging: {+materialized: view, +schema: staging}
    intermediate: {+materialized: view, +schema: intermediate}
    marts: {+materialized: table, +schema: marts}
