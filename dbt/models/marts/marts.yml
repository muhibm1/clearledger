version: 2
models:
  - name: revenue_by_customer
    meta: { owner: team/finance, tier: 1, contract: true }
    description: Billed, paid and still open per customer, in USD. One row per real customer after duplicates are merged.
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: invoiced
        tests: [not_null]
      - name: paid
        description: Settled on invoices (what Odoo has reconciled against them). Not cash received; see cash_received.
      - name: cash_received
        description: Money received, in USD, net of refunds paid back, credited to the customer whose invoices each payment settled (a parent paying a subsidiary's invoices counts for the subsidiary). Differs from paid by overpayments, duplicate receipts, write-offs and exchange differences.
      - name: cash_refunded
        description: Refunds paid out to the customer, in USD (positive). Already taken off cash_received.
      - name: source_invoice_ids
        description: The Odoo invoice ids behind this row. `clearledger trace` expands them.
        tests: [not_null]
  - name: receivables_aging
    meta: { owner: team/finance, tier: 1, contract: true }
    description: Money still owed per customer, by days past due on the as_of date. Each installment of an invoice is aged by its own due date. Open credit notes and residues under the materiality floor are in their own columns, not in the buckets.
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: open_credit_notes
        description: Credit notes not yet applied or refunded (negative). Not aged.
      - name: rounding_residue
        description: Open amounts on invoices below the materiality floor (1.00). Not late money.
  - name: deal_to_cash
    meta: { owner: team/revenue-ops, tier: 1 }
    description: Every won deal, followed through order, invoice and payment.
    columns:
      - name: deal_id
        tests: [unique, not_null]
      - name: not_yet_invoiced
        description: Ordered value not yet invoiced (never negative).
      - name: possible_unlinked_invoice_ids
        description: Posted invoices of the same customer that no order lists and that fit in what is not yet invoiced. A rebill or a hand-made invoice for this order, to be linked in Odoo by a person; not counted in invoiced.
      - name: cancelled_invoice_ids
        description: Invoices listed on the deal's orders that were cancelled.
      - name: status
        tests:
          - accepted_values:
              values: ['won, no order', 'order cancelled', 'ordered, not invoiced', 'invoiced, unpaid', 'partly paid', 'paid', 'paid, order not fully invoiced']
  - name: overdue_invoices
    meta: { owner: team/finance, tier: 1 }
    description: Remit's work list. Every customer invoice still owed and due within 3 days or late, with the customer's unused credit and the flags the collections playbook holds on.
    columns:
      - name: invoice_id
        tests: [unique, not_null]
      - name: customer_key
        tests: [not_null]
      - name: amount_open_usd
        description: Everything still open on the invoice.
        tests: [not_null]
      - name: amount_due_now_usd
        description: Open on the installments due by the as_of date plus 3 days. The part to ask for.
      - name: due_date
        description: Due date of the oldest installment still open and due by then (the invoice header holds only the last one).
      - name: customer_unmatched_payments_usd
        description: Cash the customer sent that no invoice has absorbed (overpayments, payments matched to nothing). Net of refunds; credited by whose invoices each payment settled.
      - name: customer_possible_duplicate_payments_usd
        description: The part of that credit that repeats another payment of the same amount from the same customer within two weeks, matched to nothing. Probably sent twice.
      - name: changed_after_posting
        description: True when the invoice's amount, customer, due date or invoice date changed after it was first posted. changed_fields says which; first_posted_* hold what it first said.
      - name: source_ref
        description: The exact Odoo version the row was built from. Every Remit action cites it.
        tests: [not_null]
exposures:
  - name: month_end_close
    type: analysis
    owner: {name: Finance, email: finance@example.com}
    description: Month-end close reads billed, paid and open per customer, and the aging buckets for the bad-debt reserve.
    depends_on: [ref('revenue_by_customer'), ref('receivables_aging')]
    meta: { tier: 1 }
  - name: collections_queue
    type: application
    owner: {name: Revenue ops, email: revops@example.com}
    description: The weekly list of late customers the collections team calls.
    depends_on: [ref('receivables_aging'), ref('deal_to_cash')]
    meta: { tier: 1 }
  - name: remit
    type: application
    owner: {name: Finance, email: finance@example.com}
    description: Remit, the collections agent. Reads the overdue list each morning, proposes the playbook's next step, and posts approved reminders to Odoo.
    depends_on: [ref('overdue_invoices')]
    meta: { tier: 1 }
