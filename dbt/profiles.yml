clearledger:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('CLEARLEDGER_PGHOST', '/tmp') }}"
      port: 5432
      user: "{{ env_var('CLEARLEDGER_PGUSER', 'odoo') }}"
      password: "{{ env_var('CLEARLEDGER_PGPASSWORD', '') }}"
      dbname: "{{ env_var('CLEARLEDGER_PGDATABASE', 'warehouse') }}"
      schema: dbt
      threads: 4
